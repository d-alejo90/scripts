# repo-cloner groups
#
# One line per group. Repositories matching a line are offered in the picker
# and cloned into <folder>/<repo-name> under the destination directory.
#
# Format:
#   <folder>|<owner>|<name filter regex, empty = every non-archived repo>
#
# - <owner> is any GitHub user or organisation you can read with `gh`.
# - The filter is a case-insensitive regex matched against the repo name.
# - Archived repositories are always skipped.
#
# Copy this file to ~/.config/repo-cloner/groups.conf and edit it.

# Every repository in an organisation
work|acme-inc|

# Only the repositories of one client, kept in their own folder
client|my-user|clientname

# A regex filter, for repos that share a naming prefix
labs|my-user|^lab-
